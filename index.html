<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代課費計算與管理系統 - 入口門戶</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #1e3a8a;
      --bg-color: #f1f5f9;
      --text-color: #1e293b;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    
    .portal-container {
      max-width: 800px;
      width: 100%;
      text-align: center;
    }
    
    header {
      margin-bottom: 3rem;
    }
    
    header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    
    header p {
      color: #64748b;
      font-size: 1.1rem;
    }
    
    .grid-portal {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }
    
    .portal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-decoration: none;
      color: var(--text-color);
      box-shadow: var(--shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    
    .portal-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border-color: #3b82f6;
    }
    
    .icon-wrapper {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.5rem;
      transition: all 0.3s;
    }
    
    .portal-card:hover .icon-wrapper {
      transform: scale(1.1);
    }
    
    .teacher-card .icon-wrapper {
      background-color: #eff6ff;
      color: #3b82f6;
    }
    
    .admin-card .icon-wrapper {
      background-color: #f0fdf4;
      color: #10b981;
    }
    
    .portal-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #0f172a;
    }
    
    .portal-card p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    
    footer {
      margin-top: 4rem;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="portal-container">
    
    <header>
      <h1><i class="fa-solid fa-graduation-cap"></i> 代課費計算與管理系統</h1>
      <p>○○國小專屬 ─ 請選擇您要進入的模組</p>
    </header>
    
    <div class="grid-portal">
      
      <!-- Teacher Portal Link -->
      <a href="teacher.html" class="portal-card teacher-card">
        <div class="icon-wrapper">
          <i class="fa-solid fa-file-signature"></i>
        </div>
        <h2>教師交接端</h2>
        <p>供請假教師填寫假別、交代事項課表，可預覽列印 A4 紙本交接單，並送出存檔至雲端資料庫。</p>
      </a>
      
      <!-- Admin Portal Link -->
      <a href="admin.html" class="portal-card admin-card">
        <div class="icon-wrapper">
          <i class="fa-solid fa-calculator"></i>
        </div>
        <h2>行政核銷端</h2>
        <p>供行政人員月底核銷結算使用。可同步雲端資料、按月彙整款項並導出 Word 核銷憑證。</p>
      </a>
      
    </div>
    
    <footer>
      <p>國小代課費系統（分享版）</p>
    </footer>
    
  </div>
</body>
</html>
